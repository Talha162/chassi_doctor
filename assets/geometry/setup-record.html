  inherits: false;
  initial-value: 0;
}
@layer base {
  h1,
  h2,
  h3,
  h4,
  h5,
  h6 {
    font-weight: unset;
    font-size: unset;
  }
}
@layer utilities {
  .container {
    width: 100%;
    margin-inline: auto;
    padding-inline: 1rem;
  }
  @media (width >= 40rem) {
    .container {
      max-width: var(--breakpoint-sm);
    }
  }
  @media (width >= 48rem) {
    .container {
      max-width: var(--breakpoint-md);
      padding-inline: 2rem;
    }
  }
  @media (width >= 64rem) {
    .container {
      max-width: var(--breakpoint-lg);
    }
  }
  @media (width >= 80rem) {
    .container {
      max-width: var(--breakpoint-xl);
    }
  }
  @media (width >= 86rem) {
    .container {
      max-width: var(--breakpoint-2xl);
    }
  }
}
:root {
  --background: #ffffff;
  --foreground: var(--color-navy);
  --card: var(--color-surface);
  --card-foreground: var(--color-navy);
  --popover: #ffffff;
  --popover-foreground: var(--color-navy);
  --primary: var(--color-accent);
  --primary-foreground: var(--color-navy);
  --secondary: var(--color-navy);
  --secondary-foreground: #ffffff;
  --muted: var(--color-surface);
  --muted-foreground: #4a5a73;
  --accent: var(--color-surface-strong);
  --accent-foreground: var(--color-navy);
  --destructive: var(--color-red);
  --destructive-foreground: var(--color-red);
  --border: var(--color-line);
  --input: var(--color-line-strong);
  --ring: var(--color-navy);
  --radius: 0.75rem;
  --success: oklch(92% 0.05 160deg);
  --warning: oklch(93% 0.06 85deg);
  --error: oklch(92% 0.04 25deg);
}
@layer base {
  * {
    border-color: var(--border);
    outline-color: var(--ring);
    @supports (color: color-mix(in lab, red, red)) {
      outline-color: color-mix(in oklab, var(--ring) 50%, transparent);
    }
  }
  body {
    display: flex;
    min-height: 100vh;
    flex-direction: column;
    background-color: var(--background);
    font-family: var(--font-sans);
    color: var(--foreground);
  }
  h1,
  h2,
  h3,
  h4 {
    font-family: var(--font-display);
  }
  :focus-visible {
    outline: 3px solid var(--color-accent);
    outline-offset: 0;
    box-shadow: 0 0 0 6px var(--color-navy);
  }
  #main-content:focus-visible {
    outline: none;
    box-shadow: none;
  }
}
